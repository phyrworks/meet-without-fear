name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      bot-harness: ${{ steps.filter.outputs.bot-harness }}
      python-eval: ${{ steps.filter.outputs.python-eval }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'backend/**'
              - 'mobile/**'
              - 'shared/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            python-eval:
              - 'scripts/mwf_*.py'
              - 'scripts/test_mwf_moment_eval.py'
              - 'eval/gold-scenarios.json'
              - 'eval/gold-snapshot-registry.json'
              - 'eval/gold-snapshot-registry.README.md'
              - 'eval/alignment-loop-config.yaml'
              - 'eval/icm/**'
              - 'eval/moment-types.yaml'
              - 'eval/moments/**'
              - 'eval/baselines/**'
              - 'eval/scorer/**'
              - 'eval/gold-profiles/**'
              - 'eval/prompt-versions/**'
              - 'docs/product/source-material/golden-transcripts/**'
              - '.github/workflows/ci.yml'
            bot-harness:
              - 'scripts/ec2-bot/scripts/lib/bot_harness/**'
              - 'scripts/ec2-bot/scripts/lib/invoke_provider.py'
              - 'scripts/ec2-bot/scripts/tests/**'
              - 'scripts/ec2-bot/scripts/run-claude.sh'
              - 'scripts/ec2-bot/scripts/process-queue.sh'
              - 'scripts/ec2-bot/scripts/workspace-dispatcher.sh'
              - 'scripts/ec2-bot/scripts/check-github.sh'
              - 'scripts/ec2-bot/scripts/thread-tracker.sh'
              - 'scripts/ec2-bot/socket-mode/**'
              - 'bot-workspaces/label-registry.json'
              - 'bot-workspaces/workspace-builder/shared/conventions.md'
              - '.github/workflows/ci.yml'

  ci:
    name: Checks & Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector because one of the Prisma migrations does CREATE EXTENSION
        # "vector"; PostgreSQL 18 because every primary key defaults to the
        # built-in uuidv7() (migration cuid_to_uuidv7). Production runs
        # pgvector/pgvector:pg18 (infra/aws/images.env.example).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: meetwithoutfear_user
          POSTGRES_PASSWORD: meetwithoutfear_password
          POSTGRES_DB: meetwithoutfear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://meetwithoutfear_user:meetwithoutfear_password@localhost:5432/meetwithoutfear_test
      SHADOW_DATABASE_URL: postgresql://meetwithoutfear_user:meetwithoutfear_password@localhost:5432/meetwithoutfear_test_shadow
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Prisma engines
        uses: actions/cache@v5
        with:
          path: |
            backend/node_modules/.prisma
            ~/.cache/prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Run checks (lint & type-check)
        run: npm run check

      - name: Create database roles
        # Roles are cluster-level and live outside Prisma (infra/aws/roles.sql);
        # migration phase3_app_schema_helpers refuses to run without them.
        run: >-
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL"
          -v migrator_password=ci -v app_password=ci -v job_password=ci
          -v ops_password=ci -v auth_password=ci
          -f infra/aws/roles.sql

      - name: Run database migrations
        # Prisma 7 reads the URL from prisma.config.ts, which the CLI only
        # finds in its cwd; from the repo root, point at it explicitly.
        run: npx prisma migrate deploy --config=backend/prisma.config.ts

      # Scope to backend + shared. Mobile's jest setup has a pre-existing
      # `__fbBatchedBridgeConfig is not set` failure (all 42 suites red on
      # main) — tracking separately. E2E has no `test` script; it runs
      # manually via `npm run e2e`.
      - name: Run tests (backend, shared)
        run: |
          npm run test --workspace=backend
          npm run test --workspace=shared

  python-eval:
    name: Python Eval Tests
    needs: changes
    if: needs.changes.outputs.python-eval == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run cheap eval-machine tests
        run: |
          python3 -m py_compile \
            scripts/mwf_moment_eval.py \
            scripts/mwf_gold_loop.py \
            scripts/mwf_alignment_loop.py \
            scripts/mwf_add_gold_example.py \
            scripts/mwf_extract_moments.py \
            scripts/mwf_gold_profile.py \
            scripts/mwf_alignment_status.py
          python3 scripts/test_mwf_moment_eval.py

  bot-harness:
    name: EC2 Bot Harness Tests
    needs: changes
    if: needs.changes.outputs.bot-harness == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate registry and Python harness
        run: |
          jq empty bot-workspaces/label-registry.json
          python3 -m py_compile \
            scripts/ec2-bot/scripts/lib/invoke_provider.py \
            scripts/ec2-bot/scripts/lib/bot_harness/*.py
          bash -n \
            scripts/ec2-bot/scripts/run-claude.sh \
            scripts/ec2-bot/scripts/process-queue.sh \
            scripts/ec2-bot/scripts/workspace-dispatcher.sh \
            scripts/ec2-bot/scripts/check-github.sh \
            scripts/ec2-bot/scripts/thread-tracker.sh
          node --check scripts/ec2-bot/socket-mode/socket-listener.mjs
          node scripts/ec2-bot/socket-mode/test-parse-test-command.mjs
          ! rg -n \
            'LovelyBot|@LvlyBot|lvlybot|LvlyAI/lovely|/opt/lovely-bot|lovely-bot|peter-app|C08SNTYV3AK|C0AM2J47R4L' \
            scripts/ec2-bot bot-workspaces docs/infrastructure/index.md \
            -g '!scripts/ec2-bot/scripts/tests/test_bot_harness.py'
          PYTHONPATH=scripts/ec2-bot/scripts/lib python3 -m unittest \
            scripts/ec2-bot/scripts/tests/test_bot_harness.py \
            scripts/ec2-bot/scripts/tests/test_invoke_provider.py

  # Gate job for branch protection — always runs, fails if any real job failed.
  # Set this as the required status check instead of the individual jobs.
  ci-success:
    name: CI Result
    if: always()
    needs: [changes, ci, python-eval, bot-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          echo "changes:     ${{ needs.changes.result }}"
          echo "ci:          ${{ needs.ci.result }}"
          echo "python-eval: ${{ needs.python-eval.result }}"
          echo "bot-harness: ${{ needs.bot-harness.result }}"

          # Allowlist: only 'success' and 'skipped' are acceptable.
          # Catches 'failure', 'cancelled', and any unexpected state.
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.ci.result }}" \
            "${{ needs.python-eval.result }}" \
            "${{ needs.bot-harness.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job returned unexpected result: $result"
              exit 1
            fi
          done
          echo "All checks passed (or were correctly skipped)"
