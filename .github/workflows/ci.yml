name: CI

# Pushes to the long-lived branches; PRs into main or into phoenix/target-shape
# and its feature branches (phoenix/**). A feature branch is CI'd through its PR.
on:
  push:
    branches:
      - main
      - phoenix/target-shape
  pull_request:
    branches:
      - main
      - 'phoenix/**'
    types: [opened, synchronize, reopened]

concurrency:
  # PR runs share a group per ref (a new commit supersedes the old run); push runs
  # get a group per commit, so every commit on a long-lived branch has a result
  # (one group per ref would still drop all but one pending run).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      bot-harness: ${{ steps.filter.outputs.bot-harness }}
      python-eval: ${{ steps.filter.outputs.python-eval }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On a push, compare with the branch's commit before the push (a
          # docs-only push then skips the code jobs); ignored on pull_request,
          # which compares with the PR base.
          base: ${{ github.ref }}
          filters: |
            code:
              - 'backend/**'
              - 'mobile/**'
              - 'shared/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            python-eval:
              - 'scripts/mwf_*.py'
              - 'scripts/test_mwf_moment_eval.py'
              - 'eval/gold-scenarios.json'
              - 'eval/gold-snapshot-registry.json'
              - 'eval/gold-snapshot-registry.README.md'
              - 'eval/alignment-loop-config.yaml'
              - 'eval/icm/**'
              - 'eval/moment-types.yaml'
              - 'eval/moments/**'
              - 'eval/baselines/**'
              - 'eval/scorer/**'
              - 'eval/gold-profiles/**'
              - 'eval/prompt-versions/**'
              - 'docs/product/source-material/golden-transcripts/**'
              - '.github/workflows/ci.yml'
            bot-harness:
              - 'scripts/ec2-bot/scripts/lib/bot_harness/**'
              - 'scripts/ec2-bot/scripts/lib/invoke_provider.py'
              - 'scripts/ec2-bot/scripts/tests/**'
              - 'scripts/ec2-bot/scripts/run-claude.sh'
              - 'scripts/ec2-bot/scripts/process-queue.sh'
              - 'scripts/ec2-bot/scripts/workspace-dispatcher.sh'
              - 'scripts/ec2-bot/scripts/check-github.sh'
              - 'scripts/ec2-bot/scripts/thread-tracker.sh'
              - 'scripts/ec2-bot/socket-mode/**'
              - 'bot-workspaces/label-registry.json'
              - 'bot-workspaces/workspace-builder/shared/conventions.md'
              - '.github/workflows/ci.yml'

  # No database: types and the shared + mobile suites. Runs beside
  # `backend` so the wall time is the slower of the two, not their sum.
  checks:
    name: Checks, shared & mobile tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      TZ: UTC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend

      # Type-check only: the workspaces' eslint is not clean today (backend 28
      # prettier errors, shared fails), so it is not gated here (work-k5fk.10.20).
      - name: Type-check (npm run check)
        run: npm run check

      - name: Run tests (shared)
        run: npm run test --workspace=shared

      - name: Run tests (mobile)
        run: npm run test --workspace=mobile

  # The target-shape gate, on a cluster built the way a developer's is
  # (docs/development/local-setup.md §2 and "Working on phoenix/target-shape"):
  # the mwf-postgres container with superuser mwf_user, the cluster roles from
  # infra/aws/roles.sql with the development passwords, the baseline proven by
  # run-baseline.sh --as-migrator, the 16 golden templates, then the full
  # backend suite with every role's URL. The harness defaults (mwf_user,
  # mwf_*_dev, container mwf-postgres) then hold unchanged, so nothing here
  # needs a CI-only code path. The passwords are throwaway literals on a
  # loopback-only container that dies with the job.
  backend:
    name: Target-shape gate & backend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_ENV: test
      TZ: UTC
      # Admin (superuser) URL: tooling, the golden harness's template and run
      # databases, and test DDL. The app, the job and auth log in as their own
      # roles (lib/database-urls.ts), on the test database owned by mwf_migrator.
      DATABASE_URL: postgresql://mwf_user:mwf_password@127.0.0.1:5432/mwf_target_test
      APP_DATABASE_URL: postgresql://mwf_app:mwf_app_dev@127.0.0.1:5432/mwf_target_test
      JOB_DATABASE_URL: postgresql://mwf_job:mwf_job_dev@127.0.0.1:5432/mwf_target_test
      AUTH_DATABASE_URL: postgresql://mwf_auth:mwf_auth_dev@127.0.0.1:5432/mwf_target_test
      GOLDEN_DATABASE_URL: postgresql://mwf_user:mwf_password@127.0.0.1:5432/meet_without_fear
      MWF_PG_CONTAINER: mwf-postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'npm'

      # Not a `services:` container: the scripts and the golden trace address
      # it by name (`podman exec mwf-postgres …`, `podman logs mwf-postgres`),
      # and a service container's name is generated. The image is production's
      # pin (infra/aws/images.env.example). PostgreSQL 18 for uuidv7(),
      # pgvector for the vector columns.
      - name: Start PostgreSQL 18 (mwf-postgres)
        run: |
          image="$(sed -n 's/^DB_IMAGE=//p' infra/aws/images.env.example)"
          docker run -d --name mwf-postgres \
            -e POSTGRES_USER=mwf_user -e POSTGRES_PASSWORD=mwf_password \
            -e POSTGRES_DB=meet_without_fear \
            -p 127.0.0.1:5432:5432 "$image"

      # The scripts and the trace reader call `podman`; the docker CLI takes
      # the same `exec -i` and `logs --since` arguments.
      - name: Put a podman shim on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker "$@"\n' >"$RUNNER_TEMP/bin/podman"
          chmod +x "$RUNNER_TEMP/bin/podman"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend

      # Over TCP: the image's init phase runs a socket-only server first, so a
      # socket pg_isready can succeed before the real server is up.
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec mwf-postgres pg_isready -h 127.0.0.1 -U mwf_user -d meet_without_fear && exit 0
            sleep 1
          done
          docker logs mwf-postgres; exit 1

      - name: Create cluster roles (infra/aws/roles.sql, development passwords)
        run: |
          docker exec -i mwf-postgres psql -X -v ON_ERROR_STOP=1 -U mwf_user -d meet_without_fear \
            -v migrator_password=mwf_migrator_dev -v app_password=mwf_app_dev \
            -v job_password=mwf_job_dev -v ops_password=mwf_ops_dev -v auth_password=mwf_auth_dev \
            <infra/aws/roles.sql
          docker exec -i mwf-postgres psql -X -v ON_ERROR_STOP=1 -U mwf_user -d meet_without_fear \
            <backend/scripts/d0-check.sql

      # d0-check.sql reports violations as rows, so psql exits 0 either way: run
      # its last query (the violations) alone and fail on any row.
      - name: Assert D0 (no mwf_* role but mwf_user is SUPERUSER or BYPASSRLS)
        run: |
          sql="$(sed -n '/AS d0_violation/,$p' backend/scripts/d0-check.sql)"
          [ -n "$sql" ] || { echo "::error::D0 query not found in d0-check.sql (anchor 'AS d0_violation')"; exit 1; }
          violations="$(printf '%s\n' "$sql" \
            | docker exec -i mwf-postgres psql -X -At -v ON_ERROR_STOP=1 -U mwf_user -d meet_without_fear)"
          if [ -n "$violations" ]; then
            echo "::error::D0 violated: $violations"; exit 1
          fi
          echo "D0 ok"

      - name: Baseline gate (run-baseline.sh --as-migrator)
        run: backend/scripts/target-shape/run-baseline.sh ts7_ci_gate --as-migrator --out "$RUNNER_TEMP/ts7c"

      # As run-baseline.sh --dev creates it: owned by mwf_migrator and deployed
      # logged in as it, so no runtime role owns any object.
      - name: Create the test database (mwf_target_test)
        run: |
          docker exec mwf-postgres psql -X -v ON_ERROR_STOP=1 -U mwf_user -d postgres \
            -c "CREATE DATABASE mwf_target_test OWNER mwf_migrator"
          cd backend
          DATABASE_URL=postgresql://mwf_migrator:mwf_migrator_dev@127.0.0.1:5432/mwf_target_test \
            npx prisma migrate deploy

      # One template per committed manifest (__fixtures__/target/<STAGE>.json,
      # 16 today), so a new stage is built without editing this file.
      - name: Build the golden templates (mwf_tfx_*)
        working-directory: backend
        run: |
          for f in src/testing/golden/__fixtures__/target/*.json; do
            npx tsx src/testing/golden/cli.ts build "$(basename "$f" .json)"
          done
          npx tsx src/testing/golden/cli.ts list

      # The build rewrites the committed manifests. Seeded ids (uuidv7) and builtAt
      # differ on every build; everything else (database, emails, tables, row
      # counts) must not, or the committed manifests are stale for this schema.
      - name: Rebuilt manifests match the committed ones (ids and builtAt masked)
        run: |
          mask() {
            sed -E -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g' \
              -e 's/"builtAt": "[^"]*"/"builtAt": "<t>"/'
          }
          status=0
          for f in backend/src/testing/golden/__fixtures__/target/*.json; do
            diff -u <(git show "HEAD:$f" | mask) <(mask <"$f") || status=1
          done
          exit $status

      - name: Run tests (backend)
        run: npm run test --workspace=backend
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # The server log holds bind values inlined into plan predicates (ids, not
      # message text: docs/development/local-setup.md); it is uploaded only on
      # failure, to an artifact (public repo: anyone signed in can download it), and the container's data is synthetic.
      - name: Save the PostgreSQL log on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/ts7c"
          docker logs mwf-postgres >"$RUNNER_TEMP/ts7c/mwf-postgres.log" 2>&1 || true

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: ${{ runner.temp }}/ts7c
          if-no-files-found: ignore

  python-eval:
    name: Python Eval Tests
    needs: changes
    if: needs.changes.outputs.python-eval == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run cheap eval-machine tests
        run: |
          python3 -m py_compile \
            scripts/mwf_moment_eval.py \
            scripts/mwf_gold_loop.py \
            scripts/mwf_alignment_loop.py \
            scripts/mwf_add_gold_example.py \
            scripts/mwf_extract_moments.py \
            scripts/mwf_gold_profile.py \
            scripts/mwf_alignment_status.py
          python3 scripts/test_mwf_moment_eval.py

  bot-harness:
    name: EC2 Bot Harness Tests
    needs: changes
    if: needs.changes.outputs.bot-harness == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate registry and Python harness
        run: |
          jq empty bot-workspaces/label-registry.json
          python3 -m py_compile \
            scripts/ec2-bot/scripts/lib/invoke_provider.py \
            scripts/ec2-bot/scripts/lib/bot_harness/*.py
          bash -n \
            scripts/ec2-bot/scripts/run-claude.sh \
            scripts/ec2-bot/scripts/process-queue.sh \
            scripts/ec2-bot/scripts/workspace-dispatcher.sh \
            scripts/ec2-bot/scripts/check-github.sh \
            scripts/ec2-bot/scripts/thread-tracker.sh
          node --check scripts/ec2-bot/socket-mode/socket-listener.mjs
          node scripts/ec2-bot/socket-mode/test-parse-test-command.mjs
          ! rg -n \
            'LovelyBot|@LvlyBot|lvlybot|LvlyAI/lovely|/opt/lovely-bot|lovely-bot|peter-app|C08SNTYV3AK|C0AM2J47R4L' \
            scripts/ec2-bot bot-workspaces docs/infrastructure/index.md \
            -g '!scripts/ec2-bot/scripts/tests/test_bot_harness.py'
          PYTHONPATH=scripts/ec2-bot/scripts/lib python3 -m unittest \
            scripts/ec2-bot/scripts/tests/test_bot_harness.py \
            scripts/ec2-bot/scripts/tests/test_invoke_provider.py

  # Gate job for branch protection — always runs, fails if any real job failed.
  # Set this as the required status check instead of the individual jobs.
  ci-success:
    name: CI Result
    if: always()
    needs: [changes, checks, backend, python-eval, bot-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          echo "changes:     ${{ needs.changes.result }}"
          echo "checks:      ${{ needs.checks.result }}"
          echo "backend:     ${{ needs.backend.result }}"
          echo "python-eval: ${{ needs.python-eval.result }}"
          echo "bot-harness: ${{ needs.bot-harness.result }}"

          # Allowlist: only 'success' and 'skipped' are acceptable.
          # Catches 'failure', 'cancelled', and any unexpected state.
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.checks.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.python-eval.result }}" \
            "${{ needs.bot-harness.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job returned unexpected result: $result"
              exit 1
            fi
          done
          echo "All checks passed (or were correctly skipped)"
