name: AWS Deploy
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/aws/**'
      - '.github/workflows/aws-deploy.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact source commit (blank deploys this workflow commit)'
        required: false
        type: string
concurrency:
  group: aws-production-deploy
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_REGION: us-west-2
      BACKUP_BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare isolated release source
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
          INITIAL_REF: ${{ vars.AWS_INITIAL_RELEASE }}
        run: |
          set -euo pipefail
          source_ref="${REQUESTED_REF:-${INITIAL_REF:-$GITHUB_SHA}}"
          source_sha=$(git rev-parse "$source_ref^{commit}")
          release_id="${source_sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p /tmp/mwf-build
          git archive "$source_sha" backend shared package.json package-lock.json | tar -x -C /tmp/mwf-build
          mkdir -p /tmp/mwf-build/infra/aws
          cp infra/aws/{Dockerfile,Dockerfile.dockerignore,prepare-source.py,healthcheck.cjs} /tmp/mwf-build/infra/aws/
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - name: Build and publish immutable release
        run: |
          set -euo pipefail
          image="mwf-api:$RELEASE_ID"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "mwf.infrastructure-revision=$GITHUB_SHA" -f /tmp/mwf-build/infra/aws/Dockerfile -t "$image" /tmp/mwf-build
          docker run --rm --entrypoint node "$image" -e "require.resolve('@aws-sdk/client-bedrock-runtime'); require.resolve('@clerk/express'); require.resolve('@prisma/client'); require('./dist/backend/src/app.js')"
          docker save "$image" | gzip -1 > /tmp/image.tar.gz
          checksum=$(sha256sum /tmp/image.tar.gz | cut -d' ' -f1)
          key="releases/artifacts/$RELEASE_ID/image.tar.gz"
          aws s3 cp /tmp/image.tar.gz "s3://$BACKUP_BUCKET/$key" --only-show-errors
          tar -czf /tmp/runtime.tar.gz -C infra/aws Caddyfile compose.yaml common.sh init-db.sh backup.sh restore.sh verify.sql fingerprint.sql deploy.sh release-poll.sh install-services.sh ops-health.sh
          runtime_checksum=$(sha256sum /tmp/runtime.tar.gz | cut -d' ' -f1)
          aws s3 cp /tmp/runtime.tar.gz "s3://$BACKUP_BUCKET/releases/artifacts/$RELEASE_ID/runtime.tar.gz" --only-show-errors
          jq -n --arg runtimeSha256 "$runtime_checksum" --arg id "$RELEASE_ID" --arg image "$image" --arg key "$key" --arg sha256 "$checksum" --arg source "$SOURCE_SHA" --arg infrastructure "$GITHUB_SHA" '{id:$id,image:$image,key:$key,sha256:$sha256,runtimeSha256:$runtimeSha256,source:$source,infrastructure:$infrastructure}' > /tmp/desired.json
          aws s3 cp /tmp/desired.json "s3://$BACKUP_BUCKET/releases/control/desired.json" --only-show-errors
      - name: Verify host reports successful migration and readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if aws s3 cp "s3://$BACKUP_BUCKET/releases/status/$RELEASE_ID.json" /tmp/status.json --only-show-errors 2>/dev/null; then
              cat /tmp/status.json
              test "$(jq -r .status /tmp/status.json)" = healthy
              exit
            fi
            sleep 10
          done
          echo '::error::Host did not confirm this release. Inspect mwf-release.service; no automatic database rollback occurs.'
          exit 1
