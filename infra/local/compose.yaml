# Local production replica (docs/deployment/local-replica.md). Loaded ONLY by
# infra/local/*.sh — never by infra/aws. It mirrors infra/aws/compose.yaml
# (same images, init-db.sh, mem limits, networks, healthcheck) with these
# deliberate differences:
#   - NODE_ENV=e2e (not production) so E2E_AUTH_BYPASS and MOCK_LLM can be on;
#     every behavioural consequence is listed in the doc;
#   - every published port binds 127.0.0.1 (the auth bypass lets anyone who
#     reaches the API impersonate any user);
#   - Caddy serves the Expo web export and proxies /api, /health, /realtime on
#     one origin instead of terminating TLS for api.meetwithoutfear.com;
#   - own compose project (mwf-local), volumes, subnet and ports, so nothing
#     here can meet the production names or the dev container mwf-postgres.
name: mwf-local
x-common: &common
  restart: unless-stopped
services:
  db:
    <<: *common
    image: ${DB_IMAGE:?Set by infra/local/up.sh from infra/aws/images.env.example}
    env_file: [{path: ./.local/database.env, format: raw}]
    volumes:
      - postgres:/var/lib/postgresql
      - ../aws/init-db.sh:/docker-entrypoint-initdb.d/10-mwf.sh:ro
    # Loopback only, as in production (there: 127.0.0.1:5432 behind SSH).
    ports: ['127.0.0.1:${MWF_LOCAL_DB_PORT:-15433}:5432']
    networks: [database, admin]
    mem_limit: 650m
    shm_size: 128m
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=35, -c, work_mem=4MB, -c, maintenance_work_mem=64MB]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    <<: *common
    image: ${APP_IMAGE:?Set by infra/local/up.sh}
    # Generated by up.sh: per-role URLs, DB_IDENTITY_BINDING, E2E settings.
    env_file: [{path: ./.local/application.env, format: raw}]
    environment:
      NODE_ENV: e2e
      PORT: '3000'
      TRUST_PROXY: '172.30.77.2'
      E2E_AUTH_BYPASS: 'true'
      MOCK_LLM: 'true'
      NODE_OPTIONS: --max-old-space-size=640
    networks:
      edge: {ipv4_address: 172.30.77.3}
      database: {}
    mem_limit: 850m
    init: true
    stop_grace_period: 20s
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, /app/infra/aws/healthcheck.cjs]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
  caddy:
    <<: *common
    image: ${CADDY_IMAGE:?Set by infra/local/up.sh from infra/aws/images.env.example}
    # Production publishes 80/443 publicly; the replica has one loopback origin.
    ports: ['127.0.0.1:${MWF_LOCAL_PORT:-18180}:8080']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {ipv4_address: 172.30.77.2}
    mem_limit: 128m
    depends_on:
      api: {condition: service_healthy}
networks:
  edge:
    ipam:
      config: [{subnet: 172.30.77.0/24}]
  database: {internal: true}
  admin: {}
volumes:
  postgres:
    name: mwf_local_postgres
  caddy_data:
    name: mwf_local_caddy_data
  caddy_config:
    name: mwf_local_caddy_config
