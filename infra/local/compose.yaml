# Local production replica (docs/deployment/local-replica.md). Loaded ONLY by
# infra/local/*.sh — never by infra/aws. It mirrors infra/aws/compose.yaml
# (same images, init-db.sh, mem limits, networks, healthcheck) with these
# deliberate differences:
#   - NODE_ENV=e2e (not production) so E2E_AUTH_BYPASS and MOCK_LLM can be on;
#     every behavioural consequence is listed in the doc;
#   - every published port binds 127.0.0.1 (the auth bypass lets anyone who
#     reaches the API impersonate any user);
#   - Caddy serves the Expo web export and proxies /api, /health, /realtime on
#     one origin instead of terminating TLS for api.meetwithoutfear.com;
#   - the database (work-k5fk.10.6) is production's: the image from build-db-image.sh (pgaudit), init-db.sh
#     then ownership.sql, TLS from db-tls.sh, pg_hba.conf rendered by up.sh from infra/aws/pg_hba.conf with
#     this instance's subnets, plus ONE replica-only line: the superuser from the API's address, for the
#     E2E tooling connection (DATABASE_URL; lib/prisma getE2EToolingPrisma), which must see every row and
#     FORCE ROW LEVEL SECURITY hides them all from mwf_migrator;
#   - own compose project (mwf-local, or mwf-local-<instance>: MWF_LOCAL_INSTANCE, common.sh), volumes,
#     subnets and ports, so nothing here can meet the production names or the dev container mwf-postgres.
x-common: &common
  restart: unless-stopped
services:
  db:
    <<: *common
    image: ${DB_IMAGE:?Set by infra/local/up.sh (infra/aws/build-db-image.sh)}
    env_file: [{path: '${MWF_LOCAL_DIR:?Set by infra/local/up.sh}/database.env', format: raw}]
    volumes:
      - postgres:/var/lib/postgresql
      - ../aws/init-db.sh:/docker-entrypoint-initdb.d/10-mwf.sh:ro
      - ../aws/ownership.sql:/docker-entrypoint-initdb.d/20-mwf-ownership.sql:ro
      - ${MWF_LOCAL_DIR}/pg_hba.conf:/etc/mwf-db/pg_hba.conf:ro
      - ${MWF_LOCAL_DIR}/db-tls:/etc/mwf-db-tls:ro
    # Loopback only, as in production (there: 127.0.0.1:5432 behind SSH).
    ports: ['127.0.0.1:${MWF_LOCAL_DB_PORT:-15433}:5432']
    networks:
      database: {ipv4_address: '${MWF_LOCAL_NET:-172.30}.78.2'}
      admin: {}
    mem_limit: 650m
    shm_size: 128m
    # Production's (infra/aws/compose.yaml): TLS, pg_hba, pgaudit.
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=35, -c, work_mem=4MB, -c, maintenance_work_mem=64MB,
              -c, hba_file=/var/run/postgresql/tls/pg_hba.conf, -c, password_encryption=scram-sha-256,
              -c, ssl=on, -c, ssl_cert_file=/var/run/postgresql/tls/server.crt,
              -c, ssl_key_file=/var/run/postgresql/tls/server.key, -c, ssl_min_protocol_version=TLSv1.3,
              -c, shared_preload_libraries=pgaudit, -c, pgaudit.log=none, -c, pgaudit.log_catalog=off,
              -c, pgaudit.log_relation=on, -c, 'log_line_prefix=%m [%p] %q%u@%d %a ']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    <<: *common
    image: ${APP_IMAGE:?Set by infra/local/up.sh}
    # Generated by up.sh: per-role URLs, DB_IDENTITY_BINDING, E2E settings.
    env_file: [{path: '${MWF_LOCAL_DIR}/application.env', format: raw}]
    volumes:
      - ${MWF_LOCAL_DIR}/db-tls/ca.crt:/etc/mwf-db-tls/ca.crt:ro
    environment:
      NODE_ENV: e2e
      PORT: '3000'
      TRUST_PROXY: '${MWF_LOCAL_NET:-172.30}.77.2'
      E2E_AUTH_BYPASS: 'true'
      MOCK_LLM: 'true'
      NODE_OPTIONS: --max-old-space-size=640
    networks:
      edge: {ipv4_address: '${MWF_LOCAL_NET:-172.30}.77.3'}
      database: {ipv4_address: '${MWF_LOCAL_NET:-172.30}.78.3'}
    mem_limit: 850m
    init: true
    stop_grace_period: 20s
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, /app/infra/aws/healthcheck.cjs]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
  caddy:
    <<: *common
    image: ${CADDY_IMAGE:?Set by infra/local/up.sh from infra/aws/images.env.example}
    # Production publishes 80/443 publicly; the replica has one loopback origin.
    ports: ['127.0.0.1:${MWF_LOCAL_PORT:-18180}:8080']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MWF_LOCAL_DIR}/web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {ipv4_address: '${MWF_LOCAL_NET:-172.30}.77.2'}
    mem_limit: 128m
    depends_on:
      api: {condition: service_healthy}
networks:
  edge:
    ipam:
      config: [{subnet: '${MWF_LOCAL_NET:-172.30}.77.0/24'}]
  # As production's (pg_hba.conf names the addresses): db .2, api .3, the migration container .4.
  database:
    internal: true
    ipam:
      config: [{subnet: '${MWF_LOCAL_NET:-172.30}.78.0/24', ip_range: '${MWF_LOCAL_NET:-172.30}.78.128/25'}]
  admin:
    ipam:
      config: [{subnet: '${MWF_LOCAL_NET:-172.30}.79.0/24', gateway: '${MWF_LOCAL_NET:-172.30}.79.1'}]
volumes:
  postgres:
    name: ${MWF_LOCAL_VOLUME_PREFIX:-mwf_local}_postgres
  caddy_data:
    name: ${MWF_LOCAL_VOLUME_PREFIX:-mwf_local}_caddy_data
  caddy_config:
    name: ${MWF_LOCAL_VOLUME_PREFIX:-mwf_local}_caddy_config
