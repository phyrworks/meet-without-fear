# PostgreSQL client authentication for the Lightsail database (design note §6 "Authentication per
# environment", owner decision Q17; work-k5fk.10.6). Mounted read-only by compose.yaml and named by
# `-c hba_file=`. First match wins; anything not matched is refused by the last line.
#
# Who connects from where (the addresses are pinned in compose.yaml):
#   172.29.1.0/24  network "database" (internal: no route out). db 172.29.1.2, api 172.29.1.3, the
#                  deploy's migration container 172.29.1.4 (deploy.sh), the role-guard preflight
#                  from the dynamic range 172.29.1.128/25.
#   172.29.2.0/24  network "admin" (only db is on it): a connection to the host's 127.0.0.1:5432
#                  (the SSH tunnels: the operator, and slam_bot_readonly through
#                  bot-db-tunnel.service) arrives from this network — from its gateway .1 through
#                  Docker's userland proxy, from db's own address under podman (measured on the
#                  local replica) — so the line names the subnet, not one address.
#   local socket   `docker compose exec db psql -U postgres` (backup.sh, restore.sh, deploy.sh's
#                  probe, the healthcheck): only root on the host can reach it.
#
# Every TCP line is hostssl + scram-sha-256: a password never crosses a network in the clear, and an
# unencrypted connection matches nothing here and is refused.

# TYPE   DATABASE  USER                                          ADDRESS          METHOD
local    all       postgres                                                       trust
local    all       all                                                            reject

# Migrations: mwf_migrator only from the deploy step's migration container.
hostssl  mwf       mwf_migrator                                  172.29.1.4/32    scram-sha-256

# The runtime logins, each only from the database network (the API and the deploy's preflight).
hostssl  mwf       mwf_app,mwf_ai,mwf_worker,mwf_ops,mwf_auth    172.29.1.0/24    scram-sha-256

# The operator (break-glass) and the bot's read-only role, through the SSH tunnels only.
hostssl  all       postgres                                      172.29.2.0/24    scram-sha-256
hostssl  mwf       slam_bot_readonly                             172.29.2.0/24    scram-sha-256

# Everything else: refused (no plain-text TCP, no other role, no other source, no replication).
host     all       all                                           0.0.0.0/0        reject
host     all       all                                           ::/0             reject
host     replication all                                         0.0.0.0/0        reject
